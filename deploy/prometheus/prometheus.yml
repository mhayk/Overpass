# Scrape config for the Overpass stack.
#
# Static targets, not service discovery. On a single-host Compose network the
# set of services is known at write time and DNS resolves by service name, so
# discovery would add a moving part with nothing to discover.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: local
    system: overpass

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Metrics the collector has received from the services via OTLP and
  # re-exposes. Application metrics arrive here, not by scraping each service
  # directly, so a service that is restarting does not produce a scrape gap
  # for metrics it already reported.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Direct scrape of the collector's own internal telemetry — queue depth,
  # dropped spans. Distinct from the job above, which is application data
  # passing through it.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # The broker itself, through prometheus-nats-exporter. Stream depth is the
  # one signal no service can report: a dead letter is a message no consumer
  # will touch, so only the broker knows how many are waiting.
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
        labels:
          tier: infrastructure

  # THERE IS NO PER-SERVICE SCRAPE JOB, and its absence is deliberate.
  #
  # One stood here until #53, scraping /metrics on tasking-api, plan-gateway,
  # planner and feasibility. No service ever served that path, and feasibility
  # has no HTTP listener at all — docker-compose.yml refuses to invent one for
  # a readiness probe, and the reason is not weaker for metrics. So the job
  # reported four targets permanently down, which is not a partial signal but
  # a false one: the first person to open Prometheus reads it as an outage.
  # It was also polluting the RED metrics, since every scrape of a path that
  # does not exist is a 404 on the HTTP histogram it is supposed to observe.
  #
  # Application metrics arrive through the otel-collector job above, pushed
  # over OTLP by both languages. ADR-0018 has the argument and states the
  # cost: there is no per-service `up{}` series. A dead service stops sending,
  # its gauges go stale after five minutes, and its counters stop advancing.
  # Liveness stays where it already was — compose healthchecks on the three
  # HTTP services, restart counts and logs on the worker.
