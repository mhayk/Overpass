# OpenTelemetry Collector pipeline.
#
# Services export here over OTLP; the collector batches, re-exposes metrics for
# Prometheus to scrape, and forwards traces to Tempo.
#
# Tempo arrived with M1-20 rather than #50 as originally planned. The point of
# M1-20 is that ONE trace spans an HTTP ingress in Go, an outbox publish, and a
# Python consumer — and there is no way to demonstrate that against a debug
# exporter, which prints spans and cannot show you they belong together.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # The browser exports spans directly for frontend timings.
          allowed_origins:
            - "http://localhost:3000"

processors:
  # Bounded queueing. Without a memory limiter a traffic spike during a k6 run
  # can OOM the collector, which loses telemetry at exactly the moment it is
  # most wanted.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  debug:
    verbosity: basic

  # Traces to Tempo. Everything goes through the collector rather than services
  # exporting to Tempo directly: one place to add sampling, redaction or a
  # second backend, and services that need to know about exactly one endpoint.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep OTel resource attributes as labels so metrics can be sliced by
    # service without a join.
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      # debug stays alongside Tempo. When a trace does not appear in Grafana the
      # first question is whether it reached the collector at all, and the
      # collector's own log is the cheapest possible answer.
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
