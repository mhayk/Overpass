name: Bug
description: Something is wrong
labels: ["type/bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: Actual behaviour, with the real output. Paste it, do not describe it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest sequence that shows it. A failing test is ideal.
    validations:
      required: true

  - type: textarea
    id: missed
    attributes:
      label: Why did the tests not catch this?
      description: >-
        The most valuable field here. A bug that reached main is also a gap in
        the verification harness, and fixing only the bug leaves the gap. Name
        the layer that should have caught it — see ADR-0010.
    validations:
      required: true
