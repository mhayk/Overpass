# Per-language CI: lint, type-check, test, coverage.
#
# Every job is guarded by a "does this exist yet?" check rather than being
# commented out until its service is built. A commented-out job is invisible and
# silently stays broken; a guarded job that reports "not yet initialised" is
# visible, runs its guard on every push, and starts working the moment the
# service lands — with no CI change needed.
#
# Path filters keep a Go-only change from paying for the Python and Node
# toolchains.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Integration
  # ---------------------------------------------------------------------------
  # Real Postgres+PostGIS and real NATS JetStream, started by Testcontainers,
  # with both service binaries running as real processes. Its own job rather
  # than part of `go`, because it is the slow one and there is no reason for a
  # unit-test failure to wait behind a container pull.
  integration:
    name: integration — real Postgres and NATS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: '**/go.sum'

      # uv, because the end-to-end trace assertion runs the Python worker as a
      # real process. Without it that test SKIPS, and a skipped test is a green
      # tick for work nobody did — which is exactly the failure the assertion
      # exists to prevent.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/feasibility/uv.lock

      # Pulled up front so the pull time is visible as its own step rather than
      # hidden inside a test timeout.
      - name: Pull the images
        run: |
          docker pull postgis/postgis:16-3.4
          docker pull nats:2.10-alpine
          docker pull grafana/tempo:2.6.1

      # -count=1 defeats the test cache unconditionally. A cached pass here
      # would mean the containers never started, and the job would be fastest
      # exactly when it was doing the least.
      - name: Integration tests
        working-directory: tests/integration
        run: go test -count=1 -timeout 15m ./...

  # ---------------------------------------------------------------------------
  # Go
  # ---------------------------------------------------------------------------
  go:
    name: go — lint, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres, because the idempotency guarantee is a property of a
    # unique constraint under concurrency and there is no useful fake for that.
    #
    # It also keeps the coverage gate honest. Without a database the store's
    # integration tests skip, roughly sixty statements count as untested, and
    # the overall figure drops below the floor — for code that IS tested, just
    # not here. Lowering the floor would have been the wrong fix.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: overpass
          POSTGRES_PASSWORD: overpass
          POSTGRES_DB: overpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overpass -d overpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OVERPASS_TEST_DSN: postgres://overpass:overpass@localhost:5432/overpass
      OVERPASS_TEST_NATS_URL: nats://localhost:4222

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: '**/go.sum'

      # Extensions, schemas and tables, in that order — the same two sources the
      # compose stack uses, so CI and a developer laptop cannot drift.
      - name: Prepare the database
        run: |
          set -euo pipefail
          export PGPASSWORD=overpass
          psql -h localhost -U overpass -d overpass -v ON_ERROR_STOP=1             -f deploy/postgres/init/01-extensions.sql
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.3
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$OVERPASS_TEST_DSN" up

      # A step, not a service container. JetStream needs --jetstream on the
      # command line and a service container has no way to pass one — measured
      # on the first run of this job: the broker came up healthy and every
      # stream creation failed with "no responders available for request".
      #
      # The flags mirror docker-compose.yml so CI and a laptop cannot drift.
      # No --store_dir: a CI broker is thrown away, and file storage here would
      # only add a volume to clean up.
      - name: Start NATS with JetStream
        run: |
          set -euo pipefail
          docker run -d --name overpass-ci-nats --network host \
            nats:2.10-alpine --jetstream --http_port=8222 --name=overpass-ci-nats
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "broker healthy"
              exit 0
            fi
            sleep 1
          done
          echo "the broker never became healthy"
          docker logs overpass-ci-nats
          exit 1

      # The same script the compose stack runs, so the streams and consumers the
      # tests bind to are the ones declared in deploy/, not a CI-only copy.
      - name: Apply the NATS topology
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD/deploy/nats:/init" \
            natsio/nats-box:0.14.3 \
            sh -c "NATS_URL=nats://127.0.0.1:4222 sh /init/init.sh"

      # The gate for #109. Publishes a real message per consumer/subject pair
      # and requires it to arrive; reading `consumer info` cannot catch a
      # filter that resolves to nothing.
      - name: Verify every consumer receives what it filters on
        run: scripts/nats-topology-check.sh nats://127.0.0.1:4222

      # tests/ is excluded and belongs to the integration job.
      #
      # Not just to save time. This job ran it too, and because actions/setup-go
      # shares the build cache between jobs, the integration job then reported
      # `ok (cached)` in 32 seconds having executed nothing — a dedicated job
      # that was a green tick for work it never did.
      - name: Discover Go modules
        id: modules
        run: |
          modules=$(find . -name go.mod -not -path './.tools/*' -not -path './tests/*' -exec dirname {} \; | sort)
          echo "found:"; echo "$modules" | sed 's/^/  /'
          {
            echo 'list<<EOF'
            echo "$modules"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: go vet
        run: |
          while read -r m; do
            [ -z "$m" ] && continue
            echo "==> $m"
            (cd "$m" && go build ./... && go vet ./...)
          done <<< "${{ steps.modules.outputs.list }}"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: gen/go
          # gen/ is generated; linting it would report style opinions about code
          # nobody wrote and cannot change without editing a generator. The
          # hand-written contracttest package is still checked.
          args: --timeout=5m ./contracttest/...

      # The action above is pinned to gen/go because that module needs the
      # generated-code exception. Service modules get the linter in full, and
      # they are discovered rather than listed — a hardcoded list is a list that
      # silently omits the next service somebody adds.
      - name: golangci-lint — service modules
        run: |
          set -euo pipefail
          # `go install` at the pinned version, exactly as `make tools` does it.
          # The upstream install.sh was tried first and failed on a checksum
          # mismatch — and it is fetched from `master`, so the installer itself
          # is unpinned, which is a poor way to install a pinned tool.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          linted=0
          while read -r m; do
            [ -z "$m" ] && continue
            case "$m" in ./gen/*) continue ;; esac
            echo "==> $m"
            (cd "$m" && "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...)
            linted=$((linted + 1))
          done <<< "${{ steps.modules.outputs.list }}"
          echo "linted $linted service module(s)"

      # -race is not optional and never will be. The concurrency this system
      # will contain — idempotent consumers, an outbox relay with SKIP LOCKED,
      # a planner holding an advisory lock — produces exactly the bugs that are
      # invisible without it.
      - name: go test -race
        run: |
          while read -r m; do
            [ -z "$m" ] && continue
            echo "==> $m"
            (cd "$m" && go test -race -coverprofile=coverage.out -covermode=atomic ./...)
          done <<< "${{ steps.modules.outputs.list }}"

      - name: Coverage gate
        run: ./scripts/coverage-gate.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: '**/coverage.out'
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Python
  # ---------------------------------------------------------------------------
  python:
    name: python — ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres and a real broker, for the same reason the go job has
    # them, and because for a long time this job had neither.
    #
    # Four modules in this suite guard on OVERPASS_TEST_DSN and
    # OVERPASS_TEST_NATS — the idempotency ledger, the outbox relay, the
    # worker's ack ordering, the ephemeris sweep. Those are exactly the four
    # things whose correctness is ABOUT a database and a broker, and without
    # the services they all skipped while the job stayed green. A skip is not a
    # pass and pytest's exit code cannot tell them apart, which is why
    # OVERPASS_REQUIRE_INTEGRATION below turns a missing variable into a hard
    # error rather than twelve quiet skips. See #133.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: overpass
          POSTGRES_PASSWORD: overpass
          POSTGRES_DB: overpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overpass -d overpass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OVERPASS_TEST_DSN: postgres://overpass:overpass@localhost:5432/overpass
      # OVERPASS_TEST_NATS, not OVERPASS_TEST_NATS_URL. The go job sets the
      # _URL spelling for its own tests; every Python test reads this one, and
      # the two are not interchangeable — a mismatch here is silent, because
      # the tests respond by skipping.
      OVERPASS_TEST_NATS: nats://127.0.0.1:4222
      OVERPASS_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check whether feasibility-service exists yet
        id: exists
        run: |
          if [ -f services/feasibility/pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "services/feasibility not yet initialised — issue #20" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ruff
        if: steps.exists.outputs.ready == 'true'
        working-directory: services/feasibility
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # --strict from day one. Retrofitting strict typing onto a codebase that
      # grew without it is a project of its own, and the orbital geometry code
      # is precisely where a silently-wrong type would hide.
      - name: mypy --strict
        if: steps.exists.outputs.ready == 'true'
        working-directory: services/feasibility
        run: uv run mypy --strict .

      # goose through the image compose already builds, not `go install`.
      # This job has no Go toolchain and should not grow one to apply a
      # migration — and using the same runner as the stack means CI and a
      # laptop cannot drift about which tool applied the schema.
      - name: Prepare the database
        if: steps.exists.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export PGPASSWORD=overpass
          psql -h localhost -U overpass -d overpass -v ON_ERROR_STOP=1             -f deploy/postgres/init/01-extensions.sql
          docker build -q -t overpass-ci-goose ./deploy/migrate
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro"             overpass-ci-goose             -dir /migrations postgres "$OVERPASS_TEST_DSN?sslmode=disable" up

      # A step, not a service container, for the reason the go job records:
      # JetStream needs --jetstream on the command line and a service container
      # has no way to pass one.
      - name: Start NATS with JetStream
        if: steps.exists.outputs.ready == 'true'
        run: |
          set -euo pipefail
          docker run -d --name overpass-ci-nats-python --network host             nats:2.10-alpine --jetstream --http_port=8222 --name=overpass-ci-nats-python
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "broker healthy"
              exit 0
            fi
            sleep 1
          done
          echo "the broker never became healthy"
          docker logs overpass-ci-nats-python
          exit 1

      # The worker binds a PRE-DECLARED durable consumer and exits if it is
      # missing — deliberately, so two services cannot race to create the same
      # one with different settings. Without this step every worker test fails
      # on a consumer that does not exist.
      - name: Apply the NATS topology
        if: steps.exists.outputs.ready == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network host -v "$PWD/deploy/nats:/init"             natsio/nats-box:0.14.3             sh -c "NATS_URL=nats://127.0.0.1:4222 sh /init/init.sh"

      # -rs, so a skip states its reason in the log and the step below can read
      # it. ONE run, not two: these tests publish to and consume from a real
      # stream, and running them twice in a job leaves the second run reading
      # the first one's messages — measured, as "15 acks outstanding" against a
      # local broker that had accumulated state.
      - name: pytest
        if: steps.exists.outputs.ready == 'true'
        working-directory: services/feasibility
        run: |
          set -euo pipefail
          uv run pytest -rs --cov --cov-report=term-missing --cov-report=xml             | tee /tmp/pytest.txt

      # The check that this job did what it now claims to.
      #
      # pytest exits 0 whether a test passed or skipped, so a service container
      # quietly removed a year from now would leave this job green having proved
      # nothing — which is exactly the state #133 found it in. The conftest gate
      # catches a missing variable; this catches the other half, a module that
      # skips for a reason of its own while the services are up.
      #
      # Named modules rather than a count: a count drifts every time somebody
      # adds a test, and drifts silently downward when somebody removes one.
      - name: The integration-backed tests actually ran
        if: steps.exists.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for module in test_idempotency test_relay test_worker test_ephemeris_sweep; do
            if grep -qE "^SKIPPED.*$module" /tmp/pytest.txt; then
              echo "::error::$module skipped; its service is not reachable and this job proved nothing"
              grep -E "^SKIPPED.*$module" /tmp/pytest.txt
              exit 1
            fi
          done
          echo "all four integration-backed modules ran"

      # Lints the repo-level Python (the contract tooling) regardless, so those
      # scripts do not quietly rot while waiting for the service to exist.
      - name: Lint repository tooling
        run: uvx ruff@0.8.4 check scripts/

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------
  web:
    name: web — eslint, tsc, vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check whether web exists yet
        id: exists
        run: |
          if [ -f web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "web/ not yet initialised — issue #30" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.exists.outputs.ready == 'true'
        working-directory: web
        run: npm ci

      - name: Lint and type-check
        if: steps.exists.outputs.ready == 'true'
        working-directory: web
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        if: steps.exists.outputs.ready == 'true'
        working-directory: web
        run: npm test

  # ---------------------------------------------------------------------------
  # Shell
  # ---------------------------------------------------------------------------
  # The contract tooling and the stack bootstrap are shell scripts, and they are
  # load-bearing: if contracts-verify.sh is subtly wrong, the drift gate stops
  # gating and nobody notices. Unquoted variables and silent failures are worth
  # catching in the scripts that guard everything else.
  shell:
    name: shell — shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh deploy/nats/*.sh

      # A script committed without its executable bit fails on the runner with
      # "Permission denied" and exit 126 — which reads like a broken script
      # rather than a broken file mode, and costs a CI round trip to work out.
      # It is an easy mistake to make from Windows, where `chmod +x` in the
      # working tree does not reach the index without `git update-index`.
      - name: Every script is executable
        run: |
          set -euo pipefail
          missing=0
          for f in scripts/*.sh deploy/nats/*.sh; do
            if [[ ! -x "$f" ]]; then
              echo "::error file=$f::not executable — run: git update-index --chmod=+x $f"
              missing=$((missing + 1))
            fi
          done
          if [[ "$missing" -gt 0 ]]; then
            echo "$missing script(s) missing the executable bit"
            exit 1
          fi
          echo "all scripts executable"

      # The gate's own tests. They are a pure function of a changed-file list,
      # so they need no repository state and run in milliseconds — there is no
      # reason for them to live anywhere but next to the linter that guards the
      # same scripts.
      - name: Path-ownership gate self-test
        run: ./scripts/check-path-ownership.test.sh

  # ---------------------------------------------------------------------------
  # Path ownership
  # ---------------------------------------------------------------------------
  # ADR-0013 keeps parallel agent tracks safe with a rule about which paths a
  # branch may touch. The ADR itself lists "stated, not enforced" as a cost.
  # This is the enforcement.
  #
  # pull_request only. On a push to main the merge has already happened, so
  # there is nothing left to gate and the diff to compare against is the branch
  # itself.
  path-ownership:
    name: path ownership — one track per change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base is needed to know what this branch actually changed.
          # The default shallow clone does not have it.
          fetch-depth: 0

      # Labels are read from the API at run time, NOT from the event payload.
      #
      # The payload is a snapshot taken when the run started, so a label added
      # after seeing the check fail never takes effect — and `gh run rerun`
      # replays the same stale payload, so re-running does not help either.
      # That made the escape hatch unusable in the only workflow anyone would
      # actually use it in: open the PR, see it fail, label it. Found by trying.
      - name: Deliberate crossing?
        id: hatch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '[.labels[].name] | join(",")')
          echo "labels: $labels"
          if [[ ",$labels," == *",crosses-tracks,"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::labelled crosses-tracks — ownership rule waived for this pull request"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check path ownership
        if: steps.hatch.outputs.skip == 'false'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE...$HEAD" | tee /tmp/changed.txt
          echo "---"
          ./scripts/check-path-ownership.sh < /tmp/changed.txt
