# Cold-start gate.
#
# The definition of done says:
#
#   git clone && docker compose up  ->  working, seeded system, under five
#   minutes, on a clean machine.
#
# That is a requirement, so it is a gate. A requirement nobody measures is an
# aspiration, and the specific failure this prevents is the classic one: it
# works on the machine that built it, and nowhere else. A GitHub runner is the
# closest thing to a clean machine available.
#
# It also asserts the stack is FUNCTIONAL, not merely healthy. Containers
# reporting healthy while the database lacks btree_gist, or NATS has no streams,
# would pass a naive check and fail the moment a service tried to use them.

name: stack

# NO path filter on pull_request, deliberately. `cold start under five minutes`
# is a REQUIRED status check on main. A path-filtered required check does not
# report "skipped" when the paths do not match — it does not report at all, and
# GitHub reads never-reported as pending, so any PR outside the filter is
# blocked forever. That is not hypothetical: it blocked #80, a docs-only PR with
# every other check green.
#
# Filtering here was an optimisation; the required check is a correctness
# property, and the optimisation was worth about forty seconds. If you are
# tempted to reintroduce the filter, drop the check from branch protection in
# the same commit, and know that you have moved the gate from before the merge
# to after it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cold-start:
    name: cold start under five minutes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Deliberately NO Docker layer cache. Caching images would measure a warm
      # start, and the claim being tested is about a clean machine.
      - name: Cold start
        env:
          BUDGET_SECONDS: 300
        run: ./scripts/stack-up.sh

      - name: Postgres has the extensions the invariant depends on
        run: |
          set -euo pipefail
          extensions=$(docker compose exec -T postgres \
            psql -U overpass -d overpass -tAc \
            "SELECT extname FROM pg_extension ORDER BY 1")
          echo "$extensions"
          for required in postgis btree_gist pgcrypto; do
            echo "$extensions" | grep -qx "$required" \
              || { echo "::error::missing extension $required"; exit 1; }
          done

      - name: Migrations were applied by the stack, not by a second command
        run: |
          set -euo pipefail
          for t in reference.satellites tasking.tasking_requests tasking.outbox \
                   feasibility.opportunities planning.collection_plans \
                   planning.acquisitions planning.request_snapshots \
                   planning.candidate_opportunities readmodel.processed_events; do
            docker compose exec -T postgres psql -U overpass -d overpass -tAc \
              "SELECT to_regclass('$t') IS NOT NULL" | grep -qx t \
              || { echo "::error::missing table $t — did the migrate container run?"; exit 1; }
            echo "  $t"
          done

      # The single most load-bearing assertion in this repository. If the
      # exclusion constraint does not reject an overlapping acquisition, then
      # the central invariant lives in application code after all and ADR-0003
      # and ADR-0004 are both wrong.
      #
      # This used to build a throwaway table and test that, which proved
      # Postgres can enforce an exclusion constraint — never in doubt — rather
      # than proving anything about ours. It now runs against the real
      # planning.acquisitions, and the script deliberately breaks the schema
      # four ways to show the assertions have teeth before applying them to the
      # genuine article.
      #
      # Phase 3 tests the opposite kind of claim, added by ADR-0015: a candidate
      # opportunity that arrives before its request snapshot must be STORABLE.
      # Its mutant is the foreign key someone would add by reflex, shown
      # rejecting exactly that arrival.
      - name: The planning schema's structural claims are enforced by the database
        run: ./scripts/db-invariants.sh

      # The idempotent-consumer guarantee is a property of a transaction and a
      # unique constraint, so it can only be tested against a real Postgres.
      # It lives here rather than in the `ci` workflow for that reason — the
      # per-language job has no database, and a version of these tests with a
      # fake connection would be testing the mock.
      # The idempotency guarantee is a property of a transaction, a unique
      # constraint and a real durable consumer. There is no useful version of
      # these with a mocked broker: what is under test is that JetStream
      # redelivers, the dedup absorbs it, and the ack reaches the server.
      - name: Effectively-once processing, against the real stack
        if: hashFiles('services/feasibility/pyproject.toml') != ''
        env:
          OVERPASS_TEST_DSN: postgres://overpass:overpass@localhost:5433/overpass
          OVERPASS_TEST_NATS: nats://localhost:4222
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd services/feasibility
          uv run pytest tests/test_idempotency.py tests/test_worker.py tests/test_relay.py -v

      # The tasking-api concurrency test is the same shape of proof: idempotency
      # under N simultaneous clients is a property of a database constraint, and
      # dropping that constraint makes this fail with sixteen duplicate requests.
      - name: Idempotency under concurrency, against the real database
        if: hashFiles('services/tasking-api/go.mod') != ''
        env:
          OVERPASS_TEST_DSN: postgres://overpass:overpass@localhost:5433/overpass
        run: |
          cd services/tasking-api
          go test ./internal/adapter/postgres/... -v -run 'Concurrent|Conflict|Atomic|Purged'


      - name: NATS topology was applied
        run: |
          set -euo pipefail
          streams=$(docker run --rm --network overpass natsio/nats-box:0.14.3 \
            sh -c 'NATS_URL=nats://nats:4222 nats stream ls -j')
          echo "$streams"
          for required in TASKING FEASIBILITY PLANNING DLQ_TASKING DLQ_FEASIBILITY DLQ_PLANNING; do
            echo "$streams" | grep -q "\"$required\"" \
              || { echo "::error::missing stream $required"; exit 1; }
          done

      # Publish a real contract fixture and pull it back through the durable
      # consumer that will actually handle it. Proves the topology is usable and
      # — the part most implementations never check — that the W3C traceparent
      # survives the hop, which is the whole basis of the distributed tracing
      # story in ADR-0003.
      - name: An event round-trips with its trace context intact
        run: |
          set -euo pipefail
          out=$(docker run --rm --network overpass \
            -v "$PWD/contracts:/contracts:ro" natsio/nats-box:0.14.3 sh -c '
              export NATS_URL=nats://nats:4222
              nats pub tasking.request.received.v1 \
                "$(cat /contracts/examples/valid/tasking.request.received.v1/minimal.json)" \
                -H "traceparent:00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01" >/dev/null
              nats consumer next TASKING feasibility-worker --count 1 --timeout 15s
            ')
          echo "$out"
          echo "$out" | grep -q '4bf92f3577b34da6a3ce929d0e0e4736' \
            || { echo "::error::traceparent did not survive the NATS hop"; exit 1; }
          echo "$out" | grep -q 'tasking.request.received.v1' \
            || { echo "::error::event payload did not round-trip"; exit 1; }

      - name: Observability is wired
        run: |
          set -euo pipefail
          # `curl && echo` cannot fail this step: a command left of && is
          # exempt from set -e, so a dead service was skipped silently (#150,
          # demonstrated wrongly passing). Probes must fail by themselves.
          curl -sf http://localhost:9090/-/healthy   > /dev/null \
            || { echo "::error::prometheus is not healthy"; exit 1; }
          echo "prometheus healthy"
          curl -sf http://localhost:3001/api/health  > /dev/null \
            || { echo "::error::grafana is not healthy"; exit 1; }
          echo "grafana healthy"
          rules=$(curl -sf http://localhost:9090/api/v1/rules | grep -o '"name":"[A-Za-z]*"' | wc -l)
          echo "alert rules loaded: $rules"
          [ "$rules" -ge 4 ] || { echo "::error::alert rules did not load"; exit 1; }

          # The DLQ alert reads a per-stream gauge that only exists when the
          # exporter is started with `-jsz all`. Without it the container comes
          # up healthy, logs "No metrics specified. Defaulting to varz", serves
          # metrics — and publishes nothing about JetStream, so the alert can
          # never fire. Observed doing exactly that before this probe existed.
          curl -sf http://localhost:7777/metrics \
            | grep -q 'jetstream_stream_total_messages{.*stream_name="DLQ_TASKING"' \
            || { echo "::error::the nats exporter publishes no JetStream stream depth; the DLQ alert cannot fire"; exit 1; }
          echo "broker stream depth is scrapeable"

      # #166: the application services must come up from a cold build too.
      # A separate budget from the 300-second infrastructure claim: this one
      # pays for four image builds (three multi-stage Go, one npm ci + next
      # build) that the infra budget was never about. It runs LAST among the
      # assertions on purpose — the real feasibility worker binds the same
      # durable consumer the round-trip probe above pulls from, and starting
      # it earlier would race the probe for its message.
      - name: The application services come up from a cold build
        env:
          BUDGET_SECONDS: 900
          COMPOSE_PROFILES: app
        run: |
          set -euo pipefail
          ./scripts/stack-up.sh
          # Same set -e exemption as above: these probes were decorative until
          # #150 — a stack with only the feasibility container up passed this
          # step. Each probe now fails the gate itself, naming the service.
          for port in 8080 8083 8084; do
            curl -sf "http://localhost:$port/readyz" > /dev/null \
              || { echo "::error::no readyz on :$port"; exit 1; }
            echo "readyz on $port"
          done
          curl -sf http://localhost:3000/ > /dev/null \
            || { echo "::error::web is not serving on :3000"; exit 1; }
          echo "web serving"
          docker compose logs feasibility | grep -q "feasibility worker starting" \
            || { echo "::error::the feasibility worker never started"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
