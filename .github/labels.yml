# Declarative label set, synced by .github/workflows/labels.yml.
#
# Declared here rather than clicked into the UI so the taxonomy is reviewable in
# a pull request. A label set that drifts from the one people actually use makes
# every filter and every chart quietly wrong.

- name: "type/feature"
  color: "1d76db"
  description: "New capability"
- name: "type/chore"
  color: "cfd3d7"
  description: "Tooling, scaffolding, dependencies"
- name: "type/docs"
  color: "0075ca"
  description: "Documentation"
- name: "type/adr"
  color: "5319e7"
  description: "Architecture decision record"
- name: "type/test"
  color: "0e8a16"
  description: "Test infrastructure or coverage"
- name: "type/perf"
  color: "fbca04"
  description: "Performance work or load testing"
- name: "type/spike"
  color: "d4c5f9"
  description: "Time-boxed investigation with a written outcome"
- name: "type/bug"
  color: "d73a4a"
  description: "Defect"

- name: "area/contracts"
  color: "006b75"
  description: "Schemas, OpenAPI, codegen"
- name: "area/tasking-api"
  color: "1f6feb"
  description: "Go REST ingress"
- name: "area/feasibility"
  color: "1f6feb"
  description: "Python SGP4 and SAR geometry"
- name: "area/planner"
  color: "1f6feb"
  description: "Go allocation and de-confliction"
- name: "area/plan-gateway"
  color: "1f6feb"
  description: "Go read models and SSE"
- name: "area/web"
  color: "1f6feb"
  description: "Next.js, Cesium, deck.gl"
- name: "area/infra"
  color: "5a5a5a"
  description: "Compose, Postgres, NATS, migrations"
- name: "area/ci"
  color: "5a5a5a"
  description: "Pipelines and gates"
- name: "area/observability"
  color: "5a5a5a"
  description: "Tracing, metrics, dashboards"

# risk/* selects the VERIFICATION STRATEGY, not the severity. risk/high marks
# where generated code is most likely to look plausible and be wrong, and those
# issues get property-based or golden-reference tests rather than example tests.
- name: "risk/high"
  color: "b60205"
  description: "Correctness is hard and failure is silent; needs property-based or golden-reference tests"
- name: "risk/medium"
  color: "e99695"
  description: "Non-trivial, but failure modes are visible"
- name: "risk/low"
  color: "f9d0c4"
  description: "Mechanical or well-understood"

# The one escape hatch in the ADR-0013 path-ownership gate. A change that
# genuinely spans services — the M1 integration work, chaos tests, anything
# end-to-end — carries this and the gate stands down. It weakens the rule on
# purpose: the ADR asks for crossings to be LOUD, not impossible, and a labelled
# crossing is visible in review while a silent one is not.
- name: "crosses-tracks"
  color: "d93f0b"
  description: "Deliberately spans more than one track; waives the ADR-0013 path-ownership gate"
