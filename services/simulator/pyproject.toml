[project]
name = "simulator-service"
version = "0.1.0"
description = "Acquisition execution simulator: what actually happened to a committed plan"
requires-python = ">=3.12"

# skyfield, and it is the second declaration of it in this repository.
#
# What it buys: SGP4 propagation of the truth element set, which is the whole
# basis of TLE_DRIFT_MISS being computed rather than rolled (ADR-0021).
#
# What it costs: feasibility already depends on it, so there are now two code
# paths in this system that call SGP4. The alternative was extracting a
# lib/python package and touching feasibility to build this service; keeping the
# two independently deployable was judged worth one duplicated dependency. The
# surface here is deliberately tiny — a propagator and one scalar — and the
# golden test pins it against both frozen fixtures so the two paths cannot
# silently disagree.
#
# NATS and Postgres arrive with the messaging layer, and this file should grow
# when they do rather than in anticipation of them.
dependencies = [
    "skyfield>=1.49,<2",
    "sgp4>=2.23,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    # The emitted event is validated against the COMMITTED schema, not against
    # this service's idea of it. rfc3339-validator is what turns `format:
    # date-time` from an annotation into an assertion, matching how
    # scripts/contracts_validate.py runs.
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
    "rfc3339-validator>=0.1,<1",
    "pytest-cov>=6,<7",
    "mypy>=1.14,<2",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The same set feasibility runs, so two Python services cannot disagree about
# what good looks like.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# skyfield and sgp4 ship no type information, and the same override exists in
# services/feasibility for the same two packages. Narrow on purpose: it silences
# the import, not this module's own types.
[[tool.mypy.overrides]]
module = ["skyfield.*", "sgp4.*"]
ignore_missing_imports = true
